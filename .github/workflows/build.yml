name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.11.1
      - name: Build
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log
      - name: Report errors
        if: failure()
        run: |
          MSG=$(grep -E "^e: |error:|What went wrong|Could not|Execution failed|^ *> " build.log | grep -v "> Task" | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::$MSG"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Akordim.apk
      - uses: actions/upload-artifact@v5
        with:
          name: Akordim
          path: Akordim.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "אקורדים 1.0.${{ github.run_number }}"
          files: Akordim.apk
          make_latest: true
